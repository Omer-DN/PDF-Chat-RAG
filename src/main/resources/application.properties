spring.application.name=rag-llm

spring.datasource.url=jdbc:postgresql://localhost:5432/rag_llm
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.show-sql=false
logging.level.org.springframework.web=INFO

# Gemini API Configuration
# ⚠️ IMPORTANT: Set these values via environment variables in production!
# Use GEMINI_APIKEY and GEMINI_BASEURL environment variables
gemini.apikey=${GEMINI_APIKEY:}
gemini.baseurl=${GEMINI_BASEURL:https://generativelanguage.googleapis.com}

# File size limits (in bytes)
# 10MB = 10 * 1024 * 1024 bytes
pdf.max.size.postgres=10485760
# 100MB = 100 * 1024 * 1024 bytes  
pdf.max.size.elasticsearch=104857600

# Elasticsearch configuration (Optional - comment out if not using Elasticsearch)
# spring.elasticsearch.uris=http://localhost:9200
# spring.elasticsearch.connection-timeout=10s
# spring.elasticsearch.socket-timeout=30s

# Disable Elasticsearch auto-configuration and health check if not using it
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
spring.elasticsearch.rest.enabled=false
management.health.elasticsearch.enabled=false