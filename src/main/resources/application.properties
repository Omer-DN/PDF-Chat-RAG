spring.application.name=rag-llm

# פורט השרת (אם 8080 תפוס, שנה ל-8081 או השאר והעצר את התהליך על 8080)
server.port=8080

# גודל מקסימלי להעלאת קובץ (PDF יכול להיות גדול)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.datasource.url=jdbc:postgresql://localhost:5432/rag_llm
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

# חשוב: update משמר טבלאות ונתונים (לא מוחק users בפתיחה/סגירה). אל תשנה ל-create או create-drop.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
# וידוא שסקריפטי SQL לא רצים אוטומטית (נתונים נשמרים; schema.sql להרצה ידנית בלבד)
spring.sql.init.mode=never

spring.jpa.show-sql=false
logging.level.org.springframework.web=INFO

# מפתח API מ-Google AI Studio – חובה להגדיר משתנה סביבה (לא לשמור בקוד!)
gemini.api-key=${GEMINI_API_KEY}
gemini.base-url=https://generativelanguage.googleapis.com
gemini.model=gemini-2.0-flash
gemini.embedding-model=gemini-embedding-001
gemini.embedding-dimensions=768

# JWT – בפרודקשן להגדיר JWT_SECRET בסביבה
jwt.secret=${JWT_SECRET:rag-llm-dev-secret-min-32-chars-change-in-prod}
jwt.expiration-ms=86400000