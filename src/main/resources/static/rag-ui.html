<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RAG Cognitive Engine </title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Mono&display=swap');
        body {
            margin: 0;
            padding: 0;
            font-family: 'Fira Mono', monospace;
            background: radial-gradient(circle at top, #001a33, #000033);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 { display:flex;align-items:center;gap:10px;margin-bottom:20px;color:#0ff;text-shadow:0 0 8px #0ff;}
        input[type="text"], input[type="file"] {
            padding:8px;border-radius:6px;border:1px solid #444;background:#222;color:#fff;width:300px;
        }
        button {padding:8px 12px;border-radius:6px;border:none;background:#0ff;color:#000;cursor:pointer;transition:.2s;margin-left:5px;}
        button:hover {background:#0cc;}
        pre {
            background: rgba(0,0,50,0.85);
            border: 2px solid #0ff;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 1000px;
            min-height: 350px;
            max-height: 600px;
            overflow-y: auto;
            font-family: 'Fira Mono', monospace;
            font-size: 18px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            transition: all 0.3s;
            position: relative;
        }
        .typing {
            border-right: 3px solid #0ff;
            animation: blink-caret 0.7s step-end infinite;
        }
        @keyframes blink-caret {
            50% { border-color: transparent; }
        }

        .sparkles {position:absolute;left:-25px;top:5px;color:#0ff;animation:pulse 1s infinite;}
        @keyframes pulse {0%,100%{opacity:0.2;transform:scale(1);}50%{opacity:1;transform:scale(1.3);}}
    </style>
</head>
<body>

<h1> RAG Cognitive Engine</h1>

<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
    <input type="file" id="pdfUpload" accept="application/pdf">
    <button onclick="uploadFile()">Upload PDF</button>
</div>

<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
    <input type="text" id="question" placeholder="Ask something…">
    <button onclick="askQuestion()">Ask</button>
    <button onclick="resetUI()" style="background:#f55;color:#fff;">Reset</button>
</div>

<pre id="answer"><span class="sparkles">✨</span></pre>

<script>
    let pdfId = null;
    let uploaded = false;
    let fileName = '';

    function uploadFile() {
        const fileInput = document.getElementById("pdfUpload");
        const file = fileInput.files[0];
        if(!file) return alert("Select a PDF");

        fileName = file.name.toLowerCase(); // לשם בדיקה בדמו
        uploaded = true;
        pdfId = 1; // בדמו, אפשר להשתמש ב-ID קבוע

        // בדמו אין צורך לשלוח ל-backend אמיתי, מחזירים הודעה
        document.getElementById("answer").textContent = `File "${file.name}" uploaded. Ready to ask questions!`;
    }

    function askQuestion() {
        const question = document.getElementById("question").value;
        const answerEl = document.getElementById("answer");

        if(!uploaded) return alert("Upload a PDF first!");
        if(!question.trim()) return;

        answerEl.innerHTML = "<span class='sparkles'>✨</span> Thinking…";

        // דמו של שאלות ותשובות לפי שם הקובץ
        setTimeout(() => {
            let answer = "No answer available";

            if(fileName.includes("harry")) {
                if(question.toLowerCase().includes("ספר לי על הארי פוטר")) {
                    answer = "הארי פוטר הוא ילד קסום שגדל בעולם הקסם והפך לגיבור בסדרת ספרי הארי פוטר.";
                } else if(question.toLowerCase().includes("מול מה התמודד הארי")) {
                    answer = "הארי התמודד מול כוחות הרשע, בעיקר וולדמורט, ועם אתגרים שונים בבית הספר והעולם הקסום.";
                } else if(question.toLowerCase().includes("איפה הארי למד")) {
                    answer = "הארי למד בבית הספר הוגוורטס לקסמים, בית ספר קסום עם מחלקות שונות ושיעורי קסמים.";
                }
            } else if(fileName.includes("omer")) {
                if(question.toLowerCase().includes("מה עשה עומר בעבודה")) {
                    answer = "עומר עבד בתחום הפיתוח, בעיקר Backend, ועסק בפרויקטים עם נתונים ומודלים.";
                } else if(question.includes("פרויקט משמעותי")) {
                    answer = "עומר עבד על פרויקט RAG שבו יצר chunks, שמר אותם ב-PostgreSQL, והתחבר באמצעות Gemini key לקבלת תשובות.";
                } else if(question.toLowerCase().includes("לאיזה משרה")) {
                    answer = "אני הייתי לוקח אותו למשרת Backend Developer או Data Engineer.";
                }
            } else if(fileName.includes("algorithm")) {
                if(question.toLowerCase().includes("כמה סוגי מיון")) {
                    answer = "קיימים מספר סוגי מיון נפוצים: Bubble Sort, Merge Sort, Quick Sort ועוד.";
                } else if(question.toLowerCase().includes("איך הכי כדאי למיין מילים")) {
                    answer = "הכי כדאי למיין מילים לפי Merge Sort או Quick Sort, כי הם מהירים גם על רשימות גדולות.";
                } else if(question.toLowerCase().includes("השוואה זמן ריצה")) {
                    answer = "זמן ריצה: Bubble Sort: O(n²), Merge Sort: O(n log n)";
                }
            }

            answerEl.textContent = answer;
        }, 800); // אפקט Thinking
    }

    function resetUI() {
        document.getElementById("pdfUpload").value = "";
        document.getElementById("question").value = "";
        document.getElementById("answer").textContent = "";
        uploaded = false;
        fileName = '';
        pdfId = null;
    }
</script>

</body>
</html>
