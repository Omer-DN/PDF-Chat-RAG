<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini RAG System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background-color: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-hidden">

<div class="flex h-screen">
    <aside class="w-64 bg-white border-l border-slate-200 flex flex-col shadow-sm">
        <div class="p-6 border-b border-slate-200 flex items-center gap-3 font-bold text-blue-600 text-xl">
            <i data-lucide="bot" class="w-8 h-8"></i>
            <span>Gemini RAG</span>
        </div>

        <div class="flex-1 overflow-y-auto p-4">
            <div class="text-xs font-semibold text-slate-400 uppercase mb-4 flex items-center gap-2">
                <i data-lucide="history" class="w-4 h-4"></i> היסטוריית קבצים
            </div>
            <div id="fileList" class="space-y-2">
                <div class="flex items-center gap-2 p-3 hover:bg-blue-50 rounded-xl cursor-pointer transition-all text-sm group">
                    <i data-lucide="file-text" class="w-5 h-5 text-blue-500"></i>
                    <span class="truncate font-medium">מסמך נוכחי (ID: 1)</span>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative">
        <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 p-4 sticky top-0 z-10">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
                <h2 class="text-lg font-bold text-slate-700">צ'אט חכם על מסמכים</h2>
                <div class="flex items-center gap-4">
                    <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-full flex items-center gap-2 transition-all shadow-lg hover:shadow-blue-200 active:scale-95">
                        <i data-lucide="upload" class="w-5 h-5"></i>
                        <span id="uploadText">העלה PDF</span>
                        <input type="file" id="fileInput" class="hidden" accept=".pdf" onchange="handleUpload(this)">
                    </label>
                </div>
            </div>
        </header>

        <div id="chatWindow" class="flex-1 overflow-y-auto p-6 space-y-6 chat-container bg-slate-50/50">
            <div class="max-w-3xl mx-auto" id="messageList">
                <div class="flex justify-end mb-6 animate-in fade-in duration-500">
                    <div class="flex gap-3 max-w-[80%] flex-row-reverse">
                        <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center shrink-0 shadow-sm border border-blue-200">
                            <i data-lucide="bot" class="w-6 h-6"></i>
                        </div>
                        <div class="p-4 rounded-2xl shadow-sm bg-blue-600 text-white leading-relaxed border border-blue-500">
                            שלום! אני מוכן לעזור. העלה קובץ PDF ונתחיל לנתח אותו יחד.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="p-6 bg-white border-t border-slate-200 shadow-[0_-4px_20px_rgba(0,0,0,0.03)]">
            <div class="max-w-3xl mx-auto flex gap-3 relative">
                <input type="text" id="userInput"
                       placeholder="שאל שאלה על תוכן המסמך..."
                       class="flex-1 bg-slate-100 border border-slate-200 rounded-2xl px-5 py-4 focus:ring-4 focus:ring-blue-500/10 focus:bg-white focus:border-blue-500 outline-none transition-all text-lg shadow-inner"
                       onkeypress="if(event.key === 'Enter') sendMessage()">

                <button onclick="sendMessage()" class="bg-blue-600 text-white p-4 rounded-2xl hover:bg-blue-700 transition-all shadow-lg hover:shadow-blue-300 active:scale-90 group">
                    <i data-lucide="send" class="w-6 h-6 group-hover:translate-x-[-2px] transition-transform"></i>
                </button>
            </div>
        </footer>
    </main>
</div>

<script>
    // אתחול אייקונים
    lucide.createIcons();

    // פונקציית העלאת קובץ
    async function handleUpload(input) {
        const file = input.files[0];
        if (!file) return;

        const uploadText = document.getElementById('uploadText');
        uploadText.innerText = 'מעלה...';

        const formData = new FormData();
        formData.append('file', file);
        formData.append('userId', '1');

        try {
            const response = await fetch('http://localhost:8080/api/pdf/upload', {
                method: 'POST',
                body: formData
            });
            if (response.ok) {
                alert('הקובץ הועלה בהצלחה! השרת מעבד אותו ברקע.');
            }
        } catch (err) {
            console.error(err);
            alert('שגיאה בתקשורת עם השרת');
        } finally {
            uploadText.innerText = 'העלה PDF';
        }
    }

    // פונקציית שליחת הודעה
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const messageList = document.getElementById('messageList');
        const question = input.value.trim();
        if (!question) return;

        // הוספת הודעת משתמש למסך
        const userHtml = `
                <div class="flex justify-start mb-6">
                    <div class="flex gap-3 max-w-[80%]">
                        <div class="w-10 h-10 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center shrink-0 border border-slate-300">
                            <i data-lucide="user" class="w-6 h-6"></i>
                        </div>
                        <div class="p-4 rounded-2xl shadow-sm bg-white border border-slate-200 text-slate-800 leading-relaxed">
                            ${question}
                        </div>
                    </div>
                </div>`;
        messageList.innerHTML += userHtml;
        input.value = '';
        lucide.createIcons();

        // גלילה למטה
        const chatWindow = document.getElementById('chatWindow');
        chatWindow.scrollTop = chatWindow.scrollHeight;

        // הצגת "חושב..."
        const loadingId = 'loading-' + Date.now();
        messageList.innerHTML += `<div id="${loadingId}" class="flex justify-end mb-6 animate-pulse text-slate-400 text-sm">Gemini חושב...</div>`;

        try {
            const response = await fetch(`http://localhost:8080/api/rag/ask?pdfId=1&userId=1&question=${encodeURIComponent(question)}`, {
                method: 'POST'
            });
            const answer = await response.text();

            document.getElementById(loadingId).remove();

            const botHtml = `
                    <div class="flex justify-end mb-6">
                        <div class="flex gap-3 max-w-[80%] flex-row-reverse">
                            <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center shrink-0 border border-blue-200 shadow-sm">
                                <i data-lucide="bot" class="w-6 h-6"></i>
                            </div>
                            <div class="p-4 rounded-2xl shadow-sm bg-blue-600 text-white leading-relaxed border border-blue-500 shadow-md">
                                ${answer}
                            </div>
                        </div>
                    </div>`;
            messageList.innerHTML += botHtml;
            lucide.createIcons();
            chatWindow.scrollTop = chatWindow.scrollHeight;

        } catch (err) {
            document.getElementById(loadingId).innerText = 'שגיאה בחיבור לשרת.';
        }
    }
</script>
</body>
</html>
